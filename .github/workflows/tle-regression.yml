name: TLE release regression checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Full-source update simulation, compatibility and publication guards
        run: |
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            npm test
          else
            npm test -- --development
          fi
      - name: Verify Organizer branch test channel and pinned installer
        if: github.ref == 'refs/heads/feature/organizer-nav-worldbooks-20261125'
        run: node loader/verify-test-channel.mjs --remote
      - name: Verify published manifests and immutable GitHub artifacts
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: npm run verify:remote
      - name: Replay runtime chain with downloaded release bytes
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: node tests/tle-update-chain.test.mjs --remote
