name: TLE release regression checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Full-source update simulation, compatibility and publication guards
        run: npm test
      - name: Verify main-branch baseline checks on pull requests
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: |
          env -u GITHUB_HEAD_REF GITHUB_REF=refs/heads/main node tests/tle-regression.test.mjs --current
          env -u GITHUB_HEAD_REF GITHUB_REF=refs/heads/main node tests/tle-companion-initialization.test.mjs
          env -u GITHUB_HEAD_REF GITHUB_REF=refs/heads/main node tests/tle-mask-hero-loader.test.mjs
      - name: Capture assembled Core inputs when regression fails
        if: failure()
        run: |
          mkdir -p /tmp/tle-core-diagnostic
          node scripts/build-core.mjs --output /tmp/tle-core-diagnostic/generated-TLE.js
          cp development/organizer/TLE.js /tmp/tle-core-diagnostic/current-TLE.js
      - name: Upload assembled Core diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tle-core-build-diagnostic-${{ github.sha }}
          path: /tmp/tle-core-diagnostic/
          if-no-files-found: error
          retention-days: 1
      - name: Verify Organizer branch test channel and pinned installer
        if: github.ref == 'refs/heads/feature/organizer-nav-worldbooks-20261125'
        run: node loader/verify-test-channel.mjs --remote
      - name: Verify Phase 3 Test channel and pinned remote artifacts
        if: github.ref == 'refs/heads/integration/phase-3-core-services-20261129' || github.head_ref == 'integration/phase-3-core-services-20261129'
        run: node loader/verify-test-channel.mjs --remote
      - name: Verify published manifests and immutable GitHub artifacts
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: npm run verify:remote
      - name: Replay runtime chain with downloaded release bytes
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: node tests/tle-update-chain.test.mjs --remote
