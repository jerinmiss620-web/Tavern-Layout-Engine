name: One-time TLE branch cleanup

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/branch-prune-once.yml"

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Delete approved obsolete branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          (async () => {
            const [owner, repo] = process.env.REPOSITORY.split("/");
            if (process.env.REF !== "refs/heads/main") {
              throw new Error("Refusing to run outside main.");
            }

            const remove = [
              "docs/bootstrap-1.0.6-info-paragraphs",
              "docs/bootstrap-1.0.6-public-migration-guide",
              "feature/auto-update-fold-v0.3.205",
              "feature/gallery-home-info-station-20261125",
              "feature/organizer-unified-v0.3.218",
              "fix/bootstrap-ios-startup-diagnostics-v1.0.3",
              "fix/bootstrap-legacy-busy-retry",
              "fix/bootstrap-v1.0.4-network-recovery",
              "fix/floor-grid-compat-guidance-v0.3.208",
              "fix/floor-help-and-theme-import-v0.3.209",
              "fix/group-manager-mobile-compact-v0.3.210",
              "fix/indexeddb-reconnect-startup-notice-20261122",
              "fix/native-update-fold-v0.3.207",
              "fix/organizer-native-batch-delete-v0.3.219",
              "fix/search-sync-and-theme-scrollbars-v0.3.211",
              "maintenance/archive-core-0.3.217",
              "maintenance/clean-historical-release-artifacts-20261127",
              "maintenance/cleanup-legacy-artifacts-20261121",
              "release/companion-optional-v0.3.212",
              "release/core-0.3.259-stable-20261126",
              "release/core-v0.3.239",
              "release/core-v0.3.264-companion-fixes",
              "release/core-v0.3.289-clean-promotion-20261127",
              "release/multi-mirror-loader-bootstrap-20261122",
              "release/official-core-v0.3.214",
              "release/optional-presentation-v0.3.213",
              "release/v0.3.217-verify",
              "ui/organizer-compact-layout-v0.3.220",
              "chore/branch-prune-once-20261127"
            ];

            const keep = new Set([
              "main",
              "feature/companion-profiles-20261123",
              "feature/gallery-home-standalone-20261126",
              "feature/nav-compat-gesture-v0.3.214",
              "feature/organizer-nav-worldbooks-20261125",
              "fix/companion-manager-width-v0.3.215",
              "release/tle-core-0.3.287",
              "release/tle-core-0.3.288",
              "test/companion-partial-fade-wallpaper-0.3.221",
              "test/tt-chatsurface-compat-0.3.195"
            ]);

            if (remove.some(name => keep.has(name))) {
              throw new Error("Safety guard: deletion list overlaps protected branches.");
            }

            const headers = {
              Authorization: `Bearer ${process.env.GH_TOKEN}`,
              Accept: "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28"
            };
            const rows = [];

            for (const name of remove) {
              const refPath = name.split("/").map(encodeURIComponent).join("/");
              const response = await fetch(
                `https://api.github.com/repos/${owner}/${repo}/git/refs/heads/${refPath}`,
                { method: "DELETE", headers }
              );

              if (response.status === 204) {
                rows.push([name, "deleted"]);
              } else if (response.status === 404) {
                rows.push([name, "already absent"]);
              } else {
                rows.push([name, `FAILED (${response.status}): ${(await response.text()).slice(0, 300)}`]);
              }
            }

            const report = [
              "## TLE branch cleanup",
              "",
              "| Branch | Result |",
              "|---|---|",
              ...rows.map(([name, result]) => `| ${name} | ${result} |`),
              "",
              `Deleted: ${rows.filter(([, result]) => result === "deleted").length}; already absent: ${rows.filter(([, result]) => result === "already absent").length}; failed: ${rows.filter(([, result]) => result.startsWith("FAILED")).length}.`,
              ""
            ].join("\n");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, report);

            const failures = rows.filter(([, result]) => result.startsWith("FAILED"));
            if (failures.length) {
              console.error("Some branch deletions failed:", failures);
              process.exitCode = 1;
            }
          })().catch(error => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE

      - name: Remove the one-time workflow
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node <<'NODE'
          (async () => {
            const [owner, repo] = process.env.REPOSITORY.split("/");
            const path = ".github/workflows/branch-prune-once.yml";
            const encodedPath = path.split("/").map(encodeURIComponent).join("/");
            const url = `https://api.github.com/repos/${owner}/${repo}/contents/${encodedPath}?ref=main`;
            const headers = {
              Authorization: `Bearer ${process.env.GH_TOKEN}`,
              Accept: "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28"
            };

            const current = await fetch(url, { headers });
            if (current.status === 404) {
              console.log("Temporary workflow file is already absent.");
              return;
            }
            if (!current.ok) {
              throw new Error(`Could not read temporary workflow: ${current.status} ${await current.text()}`);
            }
            const file = await current.json();
            const deleted = await fetch(url, {
              method: "DELETE",
              headers: { ...headers, "Content-Type": "application/json" },
              body: JSON.stringify({
                message: "chore: remove one-time branch cleanup workflow",
                sha: file.sha,
                branch: "main"
              })
            });
            if (!deleted.ok) {
              throw new Error(`Could not remove temporary workflow: ${deleted.status} ${await deleted.text()}`);
            }
            console.log("Temporary workflow removed from main.");
          })().catch(error => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
